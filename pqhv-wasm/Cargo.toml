[package]
name = "pqhv-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for PQHV client-side ballot encryption and verification"

[dependencies]
pqhv-core = { path = "../pqhv-core" }
pqhv-zkp = { path = "../pqhv-zkp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wasm-bindgen and wasm-pack dependencies will be added when this crate is developed
