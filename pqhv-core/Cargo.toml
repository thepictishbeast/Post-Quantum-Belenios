[package]
name = "pqhv-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Additively homomorphic Module-LWE encryption for post-quantum voting"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
rand_chacha = "0.3"
